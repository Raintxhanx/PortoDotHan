# Production stack: build the static bundle and serve it with NGINX.
#
#   docker compose build
#   docker compose up -d
#
# Override the published port with APP_PORT (defaults to 8091).

name: portodothan

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: portodothan:latest
    container_name: portodothan
    ports:
      - "${APP_PORT:-8091}:8080"
    restart: unless-stopped

    # The image runs as an unprivileged user and never writes to disk.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
