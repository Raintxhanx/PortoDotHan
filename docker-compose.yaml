# Production stack: build the static bundle and serve it with Node.
#
#   docker compose build
#   docker compose up -d
#
# The published port is bound to 127.0.0.1 by default, so the site is only
# reachable through the Cloudflare Tunnel on this host.
# Override APP_PORT or BIND_ADDR (e.g. 0.0.0.0) when needed.

name: portodothan

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: portodothan:latest
    container_name: portodothan
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8091}:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped

    # The container runs as a non-root user and never writes to disk.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
