# Static site config for the unprivileged NGINX image.
# The container listens on 8080 so it can run without root.

# Cache-Control per request path. Empty values are not emitted.
map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~\.(?:css|js|mjs|webp|avif|png|jpe?g|gif|svg|ico|mp3|ogg|woff2?)$ "public, max-age=2592000";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # Security headers (inherited by every location below).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HTML is revalidated on every load; hashed assets are immutable.
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Fingerprinted build output — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # Images, audio and fonts.
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|mp3|ogg|woff2?)$ {
        try_files $uri =404;
        access_log off;
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
